{% extends "base.html" %}
{% block content %}

<div style="max-width:900px; margin:0 auto;">
  <h1 style="margin-bottom:0.5rem;">Blog</h1>
  <p style="color:#6b7280; font-size:1.05rem; margin-bottom:2rem;">
    Educational insights into difficult intubation prediction, clinical decision-support models, and the science behind intuB.
  </p>

  <div class="blog-grid">
    {% for p in posts %}
      <a href="{{ url_for('main.blog_post', slug=p.slug) }}" class="blog-card">
        <div style="color:#102a43; margin-bottom:0.5rem; font-weight:600;">{{ p.title }}</div>
        <p style="color:#6b7280; font-size:0.95rem; margin:0;">{{ p.subtitle }}</p>
      </a>
    {% endfor %}
  </div>
</div>

{% endblock %}
